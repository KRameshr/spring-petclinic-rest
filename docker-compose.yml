services:
  mysql:
    image: mysql:8.4
    command: --mysql-native-password=ON
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
      - MYSQL_DATABASE=petclinic
    volumes:
      - "./conf.d:/etc/mysql/conf.d:ro"
    profiles:
      - mysql
  postgres:
    image: postgres:16.3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=petclinic
      - POSTGRES_USER=petclinic
      - POSTGRES_DB=petclinic
    profiles:
      - postgres

  specmatic:
    image: specmatic/specmatic
    volumes:
      - ".:/usr/src/app"
    working_dir: /usr/src/app
    command: examples validate --spec-file src/main/resources/openapi.yml
    profiles:
      - specmatic

  test:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - ".:/usr/src/app"
    working_dir: /usr/src/app
    command: ./mvnw test -Dtest=ContractTest
    profiles:
      - test
